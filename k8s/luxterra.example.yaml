apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxterra
  namespace: <your-namespace>
  labels:
    app: luxterra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: luxterra
  template:
    metadata:
      labels:
        app: luxterra
    spec:
      # Optional: target a GPU node and runtime if available
      # nodeSelector:
      #   kubernetes.io/hostname: <your-gpu-node>
      # runtimeClassName: nvidia
      containers:
        - name: luxterra
          image: <your-registry>/luxterra:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          volumeMounts:
            - name: dtm-cache
              mountPath: /app/data/dtm
            - name: dsm-cache
              mountPath: /app/data/dsm
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
      volumes:
        - name: dtm-cache
          hostPath:
            path: /path/to/LuxTerra/data/dtm
            type: DirectoryOrCreate
        - name: dsm-cache
          hostPath:
            path: /path/to/LuxTerra/data/dsm
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: luxterra
  namespace: <your-namespace>
  labels:
    app: luxterra
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: luxterra
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: luxterra-ingress
  namespace: <your-namespace>
spec:
  ingressClassName: <your-ingress-class>
  tls:
    - hosts:
        - <your-domain>
      secretName: luxterra-tls
  rules:
    - host: <your-domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: luxterra
                port:
                  number: 80
